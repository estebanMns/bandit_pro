services:
  # Opcional: Bandit usa la base de DATABASE_URL, por ejemplo Supabase.
  db:
    image: postgres:17-alpine
    profiles: [db-local]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    volumes:
      - media-data:/app/var/media

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    depends_on:
      - backend

  # Bandit Mobile Camera. Solo arranca con: docker compose --profile mobile up -d
  mediamtx:
    image: bluenviron/mediamtx:1.19.3
    profiles: [mobile]
    volumes:
      - ./deploy/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    environment:
      # Las variables MTX_* reemplazan claves del archivo; el secreto nunca se versiona.
      MTX_AUTHHTTPADDRESS: http://backend:8000/api/mobile-cameras/media-auth?key=${MEDIAMTX_AUTH_SECRET:-}
      MTX_WEBRTCADDITIONALHOSTS: ${MEDIAMTX_PUBLIC_HOST:-}
    ports:
      # Solo los medios WebRTC. RTSP (8554) y HTTP (8889) quedan dentro de la red de Docker.
      - "8189:8189/udp"
      - "8189:8189/tcp"
    depends_on:
      - backend

  proxy:
    image: caddy:2-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - backend

volumes:
  db-data:
  media-data:
